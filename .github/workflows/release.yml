name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v0.1.0)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: dok

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            packages: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "${{ github.event.inputs.tag }}" ] && version="${{ github.event.inputs.tag }}" && version="${version#v}"
          name="$BIN-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/$BIN.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/$BIN" "dist/$name/"
          fi
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$name.zip" "$name" >/dev/null
            certutil -hashfile "$name.zip" SHA256 | sed -n 2p | tr -d ' \r' > "$name.zip.sha256"
          else
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" | cut -d' ' -f1 > "$name.tar.gz.sha256"
          fi

      - name: Build .deb and .rpm
        if: matrix.packages
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo deb --no-build --target ${{ matrix.target }} --output dist/dok_amd64.deb
          cargo generate-rpm --target ${{ matrix.target }} --output dist/dok.x86_64.rpm
          cd dist
          for f in dok_amd64.deb dok.x86_64.rpm; do
            shasum -a 256 "$f" | cut -d' ' -f1 > "$f.sha256"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          if-no-files-found: error

  alpine:
    name: alpine .apk (${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            platform: linux/amd64
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.target }}
          path: dist

      # The .apk repackages the musl archive built above, so the binary in the
      # package is byte-identical to the one in the tarball.
      - name: Set up QEMU
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: Build the package
        env:
          ALPINE_ABUILD_KEY: ${{ secrets.ALPINE_ABUILD_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "${{ github.event.inputs.tag }}" ] && version="${{ github.event.inputs.tag }}" && version="${version#v}"
          docker run --rm --platform ${{ matrix.platform }} \
            -e ALPINE_ABUILD_KEY \
            -v "$PWD:/w" -w /w alpine:3.20 \
            sh scripts/build-apk.sh "$version" "${{ matrix.arch }}" \
              "dist/dok-$version-${{ matrix.target }}.tar.gz" out
          shasum -a 256 "out/dok-${{ matrix.arch }}.apk" | cut -d' ' -f1 \
            > "out/dok-${{ matrix.arch }}.apk.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-apk-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  release:
    name: publish github release
    needs: [build, alpine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
          draft: false

  crates-io:
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Requires a CARGO_REGISTRY_TOKEN secret; skipped cleanly when unset.
      - name: Publish
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish"
            exit 0
          fi
          cargo publish --locked --token "$TOKEN"

  homebrew:
    name: update homebrew tap
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # Requires a HOMEBREW_TAP_TOKEN secret with contents:write on the tap
      # repo. Without it the job succeeds and does nothing, so packaging can
      # never block a release.
      - name: Check for tap token
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "HAS_TOKEN=true" >> "$GITHUB_ENV"
          else
            echo "HOMEBREW_TAP_TOKEN not set — skipping tap update"
            echo "HAS_TOKEN=false" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'

      - name: Check out the tap
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          repository: alsaadii98/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Regenerate the formula from the release checksums
        if: env.HAS_TOKEN == 'true'
        run: |
          mkdir -p tap/Formula
          ./scripts/gen-formula.sh "${GITHUB_REF_NAME}" > tap/Formula/dok.rb
          cat tap/Formula/dok.rb

      - name: Commit and push
        if: env.HAS_TOKEN == 'true'
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "formula already up to date"
            exit 0
          fi
          git add Formula/dok.rb
          git commit -m "dok ${GITHUB_REF_NAME#v}"
          git push
