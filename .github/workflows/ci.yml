name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked
      # The daemon is present on the Linux runner, so exercise the real thing.
      - name: Smoke test against the runner's docker daemon
        if: runner.os == 'Linux'
        run: |
          docker run -d --name dok-smoke --label com.docker.compose.project=smoke nginx:alpine
          cargo run --locked -- ps -a --color=always
          cargo run --locked -- images
          cargo run --locked -- df
          cargo run --locked -- tree
          cargo run --locked -- inspect dok-smoke
          cargo run --locked -- top dok-smoke
          cargo run --locked -- logs -n 5
          cargo run --locked -- themes --preview
          docker rm -f dok-smoke

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked
