[package]
name = "dok-cli"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "Docker output, made readable — what eza is to ls"
authors = ["Ali H. Abdulhadi <a.h.alsaady1998@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/alsaadii98/cool-docker-commands"
homepage = "https://dok.alsaadii98.com/"
documentation = "https://github.com/alsaadii98/cool-docker-commands#readme"
keywords = ["docker", "cli", "containers", "tui", "pretty"]
categories = ["command-line-utilities", "visualization"]
exclude = ["docs/", "packaging/", "scripts/", ".github/"]

[[bin]]
name = "dok"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bollard = "0.21.1"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
terminal_size = "0.4.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
toml = "1.1.4"

# Only for restoring the default SIGPIPE handling, so piping into `head`
# stops quietly instead of panicking.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

# ── packaging ───────────────────────────────────────────────────────────────

[package.metadata.deb]
name = "dok"
maintainer = "Ali H. Abdulhadi <a.h.alsaady1998@gmail.com>"
copyright = "2026, Ali H. Abdulhadi"
license-file = ["LICENSE", "0"]
extended-description = """
dok renders docker's output the way eza renders ls: colour, icons, human sizes
and ages, compose-project grouping, and themes that change glyphs and layout as
well as palette. It talks to the Docker socket directly."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/dok", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/dok/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "dok"
summary = "Docker output, made readable"
assets = [
    { source = "target/release/dok", dest = "/usr/bin/dok", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/dok/README.md", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/dok/LICENSE", mode = "644" },
]
